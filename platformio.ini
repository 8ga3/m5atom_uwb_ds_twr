; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; ファームウェアバージョンの単一の情報源。README.md の表記と手動で同期させる。
; 運用方針は AGENTS.md の「バージョン管理」を参照。
build_flags =
	-D FW_VERSION=\"0.1.0-dev\"
lib_deps =
	m5stack/M5Unified@^0.2.21
	https://github.com/m5stack/M5Stamp-UWB.git
	adafruit/Adafruit NeoPixel@^1.12.3

; ANCHOR (main_anchor.cpp) と TAG (main_tag.cpp) はロジックが異なる別スケッチ
; だが、ピン配置・UWB初期化・LED表示など共通部分が大きいのでこの1リポジトリに
; まとめている。main_*.cpp はビルドのたびどちらか一方だけを src filter で
; 拾い、common/ 以下は両方の env から共通で使う。
; src/ 直下に置くのは main_*.cpp だけとし、両方の役割で使うコードは .cpp と
; ヘッダのみのものを問わず common/ へ置く。ただし common/ に .cpp を追加すると
; 下の src filter が両方の env で拾うので、片方の役割でしか使わないものは
; common/ に置いたうえでヘッダのみで実装する (common/wifi_config.h がその例)。
[role_anchor]
build_src_filter = +<*> -<main_tag.cpp>

[role_tag]
build_src_filter = +<*> -<main_anchor.cpp>

; AtomS3 and AtomS3 Lite share this environment: same ESP32-S3, same 8MB flash
; and the same Stamp-UWB breakout (G5/6/7/8/38/39). The sketch tells them apart
; at runtime - AtomS3 drives its LCD, AtomS3 Lite the RGB LED on G35.
[board_atoms3]
board = m5stack-atoms3
; build_flags は extends 元より後に評価される側が上書きするので、[env] の
; FW_VERSION 等を消さないよう ${env.build_flags} で明示的に引き継ぐ。
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Atom Lite (classic ESP32-PICO). Needs its own build: GPIO6-8 are the internal
; SPI flash and GPIO38/39 are input-only, so the UWB pins are remapped to the
; header (see UWB_PIN_* in src/common/hw_pins.h). Serial goes through the
; USB-UART bridge, so the USB CDC flags must not be set here.
[board_atom]
board = m5stack-atom

[env:atoms3-anchor]
extends = env, role_anchor, board_atoms3

[env:atom-anchor]
extends = env, role_anchor, board_atom

[env:atoms3-tag]
extends = env, role_tag, board_atoms3

[env:atom-tag]
extends = env, role_tag, board_atom
