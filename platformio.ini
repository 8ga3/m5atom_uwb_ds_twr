; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
lib_deps =
	m5stack/M5Unified@^0.2.21
	https://github.com/m5stack/M5Stamp-UWB.git
	adafruit/Adafruit NeoPixel@^1.12.3

; AtomS3 and AtomS3 Lite share this environment: same ESP32-S3, same 8MB flash
; and the same Stamp-UWB breakout (G5/6/7/8/38/39). The sketch tells them apart
; at runtime - AtomS3 drives its LCD, AtomS3 Lite the RGB LED on G35.
[env:m5stack-atoms3]
board = m5stack-atoms3
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Atom Lite (classic ESP32-PICO). Needs its own build: GPIO6-8 are the internal
; SPI flash and GPIO38/39 are input-only, so the UWB pins are remapped to the
; header (see UWB_PIN_* in src/main.cpp). Serial goes through the USB-UART
; bridge, so the USB CDC flags must not be set here.
[env:m5stack-atom]
board = m5stack-atom
